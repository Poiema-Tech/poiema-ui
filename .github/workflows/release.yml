name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch: docs, skills, fixes · minor: new components or tokens · major: breaking"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bump, write notes and rebuild
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release.mjs "$BUMP" "$RUNNER_TEMP/notes.md"

      - name: Test
        run: npm test

      - name: Commit, tag and push
        id: tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): $version"
          git tag "$version"
          git push origin HEAD:main "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
